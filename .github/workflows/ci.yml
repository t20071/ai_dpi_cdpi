name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests scripts api
          ruff format --check src tests scripts api

      # Tests marked "ollama" skip themselves: CI has no local model
      - name: Test
        run: pytest

      - name: Evaluate the deterministic rules (fails on any unsafe action)
        run: dpi-agent eval --offline
